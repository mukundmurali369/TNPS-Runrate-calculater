<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPS Runrate Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .calculator {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            transform: translateY(20px);
            opacity: 0;
            animation: slideIn 0.6s ease-out forwards;
        }
        @keyframes slideIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s ease;
            line-height: 1.6;
        }
        .achieved {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: #fff;
        }
        .pending {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }
        .extra {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        .current-tnps {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
        }
        @media (max-width: 480px) {
            .calculator {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🎯 TNPS Runrate Calculator</h1>
        <div class="input-group">
            <label for="promoters"> Promoters</label>
            <input type="number" id="promoters" min="0" value="0">
        </div>
        <div class="input-group">
            <label for="passives">Passives </label>
            <input type="number" id="passives" min="0" value="0">
        </div>
        <div class="input-group">
            <label for="detractors">Detractors </label>
            <input type="number" id="detractors" min="0" value="0">
        </div>
        <div class="input-group">
            <label for="target">TNPS Target (%):</label>
            <select id="target">
                <option value="50">50</option>
                <option value="60">60</option>
                <option value="70">70</option>
                <option value="80">80</option>
                <option value="85">85</option>
                <option value="88">88</option>
                <option value="90" selected>90</option>
                <option value="95">95</option>
            </select>
        </div>
        <button onclick="calculate()">Calculate Target Promoters</button>
        <div id="result"></div>
    </div>
    <script>
        function calculate() {
            const p = parseInt(document.getElementById('promoters').value) || 0;
            const s = parseInt(document.getElementById('passives').value) || 0;
            const d = parseInt(document.getElementById('detractors').value) || 0;
            const target = parseFloat(document.getElementById('target').value);
            
            const total = p + s + d;
            if (total === 0) {
                showResult('Please enter at least one response count.', 'pending');
                return;
            }
            
            const currentTNPS = Math.round(((p - d) / total) * 100);
            const numerator = -target * d - target * s - 100 * d;
            const denominator = target - 100;
            const targetP = Math.round(numerator / denominator);
            
            let message = `<div class="current-tnps"> Current TNPS: <strong>${currentTNPS}%</strong></div>`;
            
            if (targetP < 0) {
                message += `Target unachievable with current passives & detractors.`;
                showResult(message, 'pending');
            } else if (targetP <= p) {
                const extra = p - targetP;
                message += `✅ Target achieved!<br>Extra promoters: <strong>${extra}</strong>`;
                showResult(message, 'extra');
            } else {
                const pending = targetP - p;
                message += `Need <strong>${pending}</strong> more promoters<br>for ${target}% TNPS target.`;
                showResult(message, 'pending');
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = type;
            resultDiv.innerHTML = message;
            resultDiv.style.opacity = '0';
            resultDiv.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                resultDiv.style.opacity = '1';
                resultDiv.style.transform = 'scale(1)';
            }, 200);
        }
    </script>
</body>
</html>
